services:
  hbbs:
    container_name: hbbs
    image: ghcr.io/marcpope/cortendesk-server:1
    # Point -r at the public address of your relay, the one clients can reach.
    command: hbbs -r relay.example.com:21117
    ports:
      - 21115:21115
      - 21116:21116
      - 21116:21116/udp
      - 21118:21118
    volumes:
      - ./data:/root
    networks:
      - cortendesk-net
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: ghcr.io/marcpope/cortendesk-server:1
    command: hbbr
    ports:
      - 21117:21117
      - 21119:21119
    volumes:
      - ./data:/root
    networks:
      - cortendesk-net
    restart: unless-stopped

networks:
  cortendesk-net:
    external: false
