[package]
name = "hbbs"
version = "1.5.1"
authors = ["CortenDesk"]
license = "AGPL-3.0-only"
description = "ID/rendezvous and relay servers for RustDesk clients, with encrypted signalling. A fork of rustdesk-server."
repository = "https://github.com/marcpope/cortendesk-server"
edition = "2021"
build = "build.rs"
default-run = "hbbs"

[[bin]]
name = "hbbr"
path = "src/hbbr.rs"

[[bin]]
name = "cortendesk-utils"
path = "src/utils.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hbb_common = { path = "libs/hbb_common" }
serde_derive = "1.0"
serde = "1.0"
serde_json = "1.0"
lazy_static = "1.4"
clap = "2"
rust-ini = "0.18"
base64 = "0.13"
sqlx = { version = "0.8.6", default-features = false, features = [ "runtime-tokio", "sqlite", "macros", "chrono", "json" ] }
deadpool = { version = "0.8", default-features = false, features = ["managed"] }
async-trait = "0.1"
async-speed-limit = { git = "https://github.com/open-trade/async-speed-limit" }
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
once_cell = "1.8"
sodiumoxide = "0.2"
tempfile = "3"
tokio-tungstenite = "0.26"
tungstenite = "0.26"
flexi_logger = { version = "0.22", features = ["async", "use_chrono_for_offset", "dont_minimize_extra_stacks"] }
ipnetwork = "0.20"
local-ip-address = "0.5.1"
dns-lookup = "1.0.8"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# https://github.com/rustdesk/rustdesk-server-pro/issues/189, using native-tls for better tls support
reqwest = { git = "https://github.com/rustdesk-org/reqwest", features = ["blocking", "socks", "json", "native-tls", "gzip"], default-features=false }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
reqwest = { git = "https://github.com/rustdesk-org/reqwest", features = ["blocking", "socks", "json", "rustls-tls", "rustls-tls-native-roots", "gzip"], default-features=false }

# hbb_common pulls in native-tls (OpenSSL) on Linux. Build OpenSSL from source
# so the static musl binaries need no system OpenSSL.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
# The stand-in console in tests/access_policy.rs.
axum = "0.5"
libc = "0.2"

[workspace]
members = ["libs/hbb_common"]
exclude = ["ui"]

#https://github.com/johnthagen/min-sized-rust
#https://doc.rust-lang.org/cargo/reference/profiles.html#default-profiles
[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true
#opt-level = 'z' # only have smaller size after strip # Default is 3, better performance
#rpath = true # Not needed
