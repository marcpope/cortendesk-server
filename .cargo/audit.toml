# cargo audit configuration, read by local runs and the security-scan
# workflow. Advisories that a semver-compatible `cargo update` fixes are not
# listed here: update the lockfile instead. Each entry below was checked
# against what hbbs and hbbr actually run.

[advisories]
ignore = [
  # users: root appended to group listings. Only the group listing functions
  # are affected; hbb_common uses get_current_uid and get_user_by_uid. No
  # fixed release exists.
  "RUSTSEC-2025-0040",

  # zstd 0.13 / zstd-safe 7: a reused stream context leaking data, legacy
  # frame decompression exposing uninitialised memory, and seekable
  # decompression past the end. hbb_common pins zstd 0.13 (the fixes are in
  # 0.14 / zstd-safe 8) and only calls bulk compression and a plain stream
  # decoder for client message payloads. hbbs and hbbr never compress or
  # decompress: they forward messages as they are.
  "RUSTSEC-2026-0391",
  "RUSTSEC-2026-0398",
  "RUSTSEC-2026-0403",

  # rsa 0.9 Marvin timing side channel; no fixed release. In Cargo.lock only
  # through sqlx-mysql, which is not built: sqlx's mysql feature is off
  # (`cargo tree -i rsa --target all` finds no dependent).
  "RUSTSEC-2023-0071",

  # crypto-bigint 0.5 timing variability. Present in Cargo.lock but not in
  # the build for any target (`cargo tree -i crypto-bigint --target all -e
  # all` finds no dependent), so it is never compiled.
  "RUSTSEC-2026-0387",
]
